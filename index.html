<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Mochiy+Pop+One&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       基本設定
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #fff;
      color: #222;
    }

    body {
      overflow-x: hidden;
    }

    .screen {
      width: 100%;
      min-height: 100svh;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }


    /* =========================================================
       1ページ目
       ========================================================= */

    #stage1 {
      min-height: 100svh;
      overflow: hidden;
    }

    .cd-button {
      display: block;

      width: min(72vw, 340px);
      height: min(72vw, 340px);

      border-radius: 50%;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition: transform .15s ease;
    }

    .cd-button:active {
      transform: scale(.96);
    }

    .cd-button img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =========================================================
       筆記体
       ========================================================= */

    .script-text {
      margin-top: 24px;

      font-family: "Dancing Script", cursive;

      font-size: 24px;
      font-weight: 500;

      letter-spacing: .02em;

      color: #777;
    }


    /* =========================================================
       2ページ目
       ========================================================= */

    #stage2 {
      min-height: 145svh;
      position: relative;
    }

    .stage2-main {
      min-height: 105svh;
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }


    /* =========================================================
       戻る + なんもねぇ
       ========================================================= */

    .secret-area {
      width: 100%;
      height: 40svh;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      position: relative;
    }

    .back-link {
      color: #777;

      font-size: 14px;

      text-decoration: underline;
      text-underline-offset: 4px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      margin-bottom: 8px;
    }

    .secret-link {
      color: #777;

      font-size: 3px;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
    }


    /* =========================================================
       3ページ目
       超豪華ゲーミング誕生日モード
       ========================================================= */

    #stage3 {
      min-height: 100svh;
      position: relative;

      text-align: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255,255,255,1) 0%,
          rgba(255,245,180,.95) 12%,
          rgba(255,150,220,.85) 28%,
          rgba(110,220,255,.72) 47%,
          rgba(170,110,255,.72) 65%,
          rgba(45,15,90,.96) 100%
        );

      animation:
        backgroundPulse 4s ease-in-out infinite,
        gamingHue 8s linear infinite;
    }


    /* =========================================================
       七色ゲーミング光
       ========================================================= */

    .rainbow-glow {
      position: absolute;

      inset: -35%;

      background:
        conic-gradient(
          from 0deg,

          rgba(255,0,0,.28),
          rgba(255,150,0,.28),
          rgba(255,255,0,.28),
          rgba(0,255,100,.28),
          rgba(0,220,255,.28),
          rgba(90,70,255,.28),
          rgba(255,0,220,.28),
          rgba(255,0,0,.28)
        );

      filter: blur(35px);

      animation:
        rainbowRotate 9s linear infinite;

      pointer-events: none;

      z-index: 1;
    }


    /* =========================================================
       光線
       ========================================================= */

    #stage3::before {
      content: "";

      position: absolute;

      width: 130vmax;
      height: 130vmax;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        repeating-conic-gradient(
          from 0deg,

          rgba(255,255,255,0) 0deg,
          rgba(255,255,255,.12) 3deg,

          rgba(255,80,160,.28) 6deg,
          rgba(255,255,255,0) 9deg,

          rgba(70,220,255,.28) 13deg,
          rgba(255,255,255,0) 17deg,

          rgba(255,230,70,.30) 21deg,
          rgba(255,255,255,0) 26deg
        );

      animation:
        raysSpin 10s linear infinite;

      pointer-events: none;

      z-index: 2;
    }


    /* =========================================================
       キラキラ背景
       ========================================================= */

    #stage3::after {
      content:
        "✦   ✧   ✨   ✦   ✧   ✨   ✦   ✧   ✨   ✦   ✧   ✨   ✦";

      position: absolute;

      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 4%;

      font-size:
        clamp(
          15px,
          4vw,
          28px
        );

      line-height: 4.5;

      letter-spacing: 12px;

      color: rgba(255,255,255,.96);

      text-shadow:
        0 0 5px #fff,
        0 0 12px #fff,
        0 0 22px #ffd95a,
        0 0 35px #ff69d4,
        0 0 45px #63eaff;

      pointer-events: none;

      animation:
        sparkleFloat 3s ease-in-out infinite,
        sparkleTwinkle 1.4s ease-in-out infinite alternate;

      z-index: 3;
    }


    /* =========================================================
       クラッカー本体
       ========================================================= */

    .cracker {
      position: absolute;

      top: 50%;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      pointer-events: none;

      z-index: 12;

      opacity: 0;

      filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 15px #ffd84a);
    }

    .cracker-left {
      left: 3%;

      animation:
        crackerLeft
        1.7s
        cubic-bezier(.15,.8,.2,1)
        .2s
        forwards;
    }

    .cracker-right {
      right: 3%;

      animation:
        crackerRight
        1.7s
        cubic-bezier(.85,.2,.8,1)
        .2s
        forwards;
    }


    .cracker-left::before,
    .cracker-left::after,
    .cracker-right::before,
    .cracker-right::after {

      content:
        "✦ ✧ ✨ • ◆ ★ ✦ ✨";

      position: absolute;

      font-size: 20px;

      width: 190px;

      line-height: 2;

      color: #fff;

      text-shadow:
        0 0 5px #fff,
        0 0 12px #ffdd55,
        0 0 20px #ff66cc,
        0 0 30px #63eaff;

      pointer-events: none;
    }


    .cracker-left::before {
      right: -10px;
      top: -100px;

      transform: rotate(-12deg);

      animation:
        crackerBurst
        1.4s
        ease-out
        .3s
        forwards;
    }


    .cracker-left::after {
      right: -5px;
      top: 10px;

      transform: rotate(12deg);

      animation:
        crackerBurst
        1.4s
        ease-out
        .4s
        forwards;
    }


    .cracker-right::before {
      left: -10px;
      top: -100px;

      transform: rotate(12deg);

      animation:
        crackerBurst
        1.4s
        ease-out
        .3s
        forwards;
    }


    .cracker-right::after {
      left: -5px;
      top: 10px;

      transform: rotate(-12deg);

      animation:
        crackerBurst
        1.4s
        ease-out
        .4s
        forwards;
    }


    /* =========================================================
       紙吹雪
       ========================================================= */

    .confetti-container {
      position: absolute;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 15;
    }


    .confetti {
      position: absolute;

      top: -30px;

      width: 9px;
      height: 16px;

      opacity: 1;

      border-radius: 2px;

      pointer-events: none;

      will-change:
        transform,
        opacity;
    }


    @keyframes confettiFall {

      0% {
        opacity: 0;

        transform:
          translate3d(
            0,
            -40px,
            0
          )
          rotate(0deg);
      }

      8% {
        opacity: 1;
      }

      100% {
        opacity: 1;

        transform:
          translate3d(
            var(--drift),
            120vh,
            0
          )
          rotate(var(--rotation));
      }

    }


    /* =========================================================
       降ってくる祝福絵文字
       ========================================================= */

    .emoji-container {
      position: absolute;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 16;
    }


    .falling-emoji {
      position: absolute;

      top: -12vh;

      line-height: 1;

      opacity: 0;

      pointer-events: none;

      will-change:
        transform,
        opacity;

      animation:
        emojiFall
        var(--duration)
        cubic-bezier(.15,.65,.3,1)
        var(--delay)
        forwards;
    }


    @keyframes emojiFall {

      0% {
        opacity: 0;

        transform:
          translate3d(
            0,
            -10vh,
            0
          )
          rotate(0deg)
          scale(.65);
      }

      8% {
        opacity: 1;
      }

      50% {
        opacity: 1;

        transform:
          translate3d(
            var(--mid-drift),
            48vh,
            0
          )
          rotate(var(--mid-rotation))
          scale(1);
      }

      100% {
        opacity: .9;

        transform:
          translate3d(
            var(--drift),
            120vh,
            0
          )
          rotate(var(--rotation))
          scale(.8);
      }

    }


    /* =========================================================
       誕生日メッセージ
       ========================================================= */

    .birthday-message {
      position: relative;

      z-index: 20;

      font-family:
        "Mochiy Pop One",
        sans-serif;

      font-size:
        clamp(
          28px,
          8vw,
          42px
        );

      font-weight: 400;

      letter-spacing: .08em;

      color: #fff;

      padding:
        24px 30px;

      border-radius: 30px;


      /* 金色のベース */
      background:
        linear-gradient(
          120deg,

          #fff6b0 0%,
          #ffd700 12%,
          #fff7b8 25%,
          #e8a900 38%,
          #fff9ce 50%,
          #ffd700 63%,
          #fff1a0 76%,
          #d99a00 88%,
          #fff4a8 100%
        );

      background-size:
        500% 500%;


      /* 多重ゴールドフレーム */

      border:
        4px solid #fff;

      box-shadow:

        0 0 0 3px #ffd700,

        0 0 0 7px #fff2a0,

        0 0 0 10px #d99b00,

        0 0 0 13px #fff,

        0 0 0 16px #ffd700,

        0 0 12px #fff,

        0 0 25px #ffe15b,

        0 0 45px #ffb900,

        0 0 70px #fff0a0,

        0 0 100px rgba(255,80,210,.75),

        0 12px 45px rgba(40,10,80,.35);


      text-shadow:

        0 2px 0 rgba(100,40,90,.30),

        0 0 7px #fff,

        0 0 16px #fff,

        0 0 28px #fff5a0,

        0 0 40px #ffd700;


      animation:

        birthdayAppear
        1.1s
        cubic-bezier(.2,1.4,.4,1)
        forwards,

        goldShimmer
        2.2s
        linear
        1.1s
        infinite,

        birthdayGlow
        1.5s
        ease-in-out
        1.1s
        infinite
        alternate;
    }


    /* =========================================================
       メッセージ周辺の巨大キラキラ
       ========================================================= */

    .birthday-message::before,
    .birthday-message::after {

      position: absolute;

      z-index: -1;

      color: #fff;

      pointer-events: none;

      text-shadow:

        0 0 6px #fff,

        0 0 14px #ffd95a,

        0 0 25px #ff9dd8,

        0 0 40px #5eeaff,

        0 0 55px #fff;
    }


    .birthday-message::before {

      content:
        "✦";

      left: -42px;
      top: -38px;

      font-size: 46px;

      animation:
        starPop
        1.1s
        ease-in-out
        infinite;
    }


    .birthday-message::after {

      content:
        "✧";

      right: -42px;
      bottom: -36px;

      font-size: 50px;

      animation:
        starPop
        1.1s
        ease-in-out
        .5s
        infinite;
    }


    /* =========================================================
       3ページ目 戻る
       ========================================================= */

    .stage3-back {

      position: relative;

      z-index: 30;

      margin-top: 90px;
    }


    /* =========================================================
       アニメーション
       ========================================================= */

    @keyframes birthdayAppear {

      0% {
        opacity: 0;

        transform:
          scale(.35)
          rotate(-7deg);
      }

      55% {
        opacity: 1;

        transform:
          scale(1.13)
          rotate(2deg);
      }

      75% {
        transform:
          scale(.96)
          rotate(-1deg);
      }

      100% {
        opacity: 1;

        transform:
          scale(1)
          rotate(0deg);
      }

    }


    @keyframes birthdayGlow {

      0% {

        box-shadow:

          0 0 0 3px rgba(255,220,70,.7),

          0 0 0 7px #fff2a0,

          0 0 0 10px #d99b00,

          0 0 0 13px #fff,

          0 0 15px #fff,

          0 0 30px #ffd700,

          0 0 55px #ffb900,

          0 0 80px #fff0a0;

      }

      100% {

        box-shadow:

          0 0 0 4px #fff,

          0 0 0 8px #ffd700,

          0 0 0 12px #fff4a0,

          0 0 0 16px #d99b00,

          0 0 25px #fff,

          0 0 50px #ffd700,

          0 0 85px #ffb900,

          0 0 120px #fff0a0,

          0 0 150px rgba(255,100,220,.7);

      }

    }


    @keyframes goldShimmer {

      0% {
        background-position:
          0% 50%;
      }

      50% {
        background-position:
          100% 50%;
      }

      100% {
        background-position:
          0% 50%;
      }

    }


    @keyframes backgroundPulse {

      0%,
      100% {
        filter:
          saturate(1);
      }

      50% {
        filter:
          saturate(1.45);
      }

    }


    @keyframes gamingHue {

      0% {
        filter:
          hue-rotate(0deg)
          saturate(1.1);
      }

      25% {
        filter:
          hue-rotate(70deg)
          saturate(1.3);
      }

      50% {
        filter:
          hue-rotate(150deg)
          saturate(1.25);
      }

      75% {
        filter:
          hue-rotate(250deg)
          saturate(1.35);
      }

      100% {
        filter:
          hue-rotate(360deg)
          saturate(1.1);
      }

    }


    @keyframes rainbowRotate {

      from {
        transform:
          rotate(0deg)
          scale(1);
      }

      to {
        transform:
          rotate(360deg)
          scale(1);
      }

    }


    @keyframes raysSpin {

      from {
        transform:
          translate(-50%, -50%)
          rotate(0deg);
      }

      to {
        transform:
          translate(-50%, -50%)
          rotate(360deg);
      }

    }


    @keyframes sparkleFloat {

      0%,
      100% {
        transform:
          translateY(0)
          scale(1);
      }

      50% {
        transform:
          translateY(-10px)
          scale(1.08);
      }

    }


    @keyframes sparkleTwinkle {

      0% {
        opacity: .35;
      }

      100% {
        opacity: 1;
      }

    }


    @keyframes starPop {

      0%,
      100% {

        transform:
          scale(.7)
          rotate(0deg);

        opacity: .55;
      }

      50% {

        transform:
          scale(1.5)
          rotate(25deg);

        opacity: 1;
      }

    }


    @keyframes crackerLeft {

      0% {

        opacity: 0;

        transform:
          translateX(0)
          scale(.3);
      }

      12% {
        opacity: 1;
      }

      100% {

        opacity: 0;

        transform:
          translateX(25vw)
          scale(2);
      }

    }


    @keyframes crackerRight {

      0% {

        opacity: 0;

        transform:
          translateX(0)
          scale(.3);
      }

      12% {
        opacity: 1;
      }

      100% {

        opacity: 0;

        transform:
          translateX(-25vw)
          scale(2);
      }

    }


    @keyframes crackerBurst {

      0% {

        opacity: 0;

        transform:
          scale(.2)
          translateX(0);
      }

      25% {
        opacity: 1;
      }

      100% {

        opacity: 0;

        transform:
          scale(1.4)
          translateX(80px);
      }

    }


    /* =========================================================
       スクロールバー非表示
       ========================================================= */

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    html {
      scrollbar-width: none;
    }

  </style>
</head>


<body>


  <!-- =========================================================
       1ページ目
       ========================================================= -->

  <section
    id="stage1"
    class="screen"
  >

    <a
      id="mainLink"
      class="cd-button"
      href="#"
    >

      <img
        src="CD.PNG"
        alt="Play"
      >

    </a>


    <div class="script-text">
      Dear you…
    </div>

  </section>



  <!-- =========================================================
       2ページ目
       ========================================================= -->

  <section
    id="stage2"
    class="hidden"
  >

    <div class="stage2-main">

      <div class="script-text">
        thank you for Watching!
      </div>

    </div>


    <div class="secret-area">

      <a
        id="backLink2"
        class="back-link hidden"
        href="#"
      >
        戻る
      </a>


      <a
        id="secretLink"
        class="secret-link"
        href="#"
      >
        なんもねぇ
      </a>

    </div>

  </section>



  <!-- =========================================================
       3ページ目
       ========================================================= -->

  <section
    id="stage3"
    class="screen hidden"
  >

    <!-- 七色ゲーミング -->
    <div class="rainbow-glow"></div>


    <!-- 左右クラッカー -->
    <div
      class="cracker cracker-left"
    ></div>

    <div
      class="cracker cracker-right"
    ></div>


    <!-- 紙吹雪 -->
    <div
      id="confettiContainer"
      class="confetti-container"
    ></div>


    <!-- 祝福絵文字 -->
    <div
      id="emojiContainer"
      class="emoji-container"
    ></div>


    <!-- メイン -->
    <div class="birthday-message">
      誕生日おめでとう！
    </div>


    <!-- 戻る -->
    <a
      id="backLink3"
      class="back-link stage3-back hidden"
      href="#"
    >
      戻る
    </a>

  </section>



  <script>

    /* =========================================================
       YouTube URL
       ========================================================= */

    const PLAYLIST_URL =
      "https://youtube.com/playlist?list=PLE8o6D-qzhzY&si=udX1vBSBjEIDuKgC";


    const SECRET_URL =
      "https://youtu.be/aRiVUVNUhIs?si=hcRCJKqANeBVuRmt";


    /* =========================================================
       セッション状態管理
       
       localStorageではなくsessionStorageを使用。

       ・同じページセッション中 → 状態を保持
       ・Safariの再読み込み → 状態を保持
       ・YouTubeから戻る → 状態を保持
       ・新しくNFCから開く → 最初から
       ========================================================= */

    const MAIN_PLAYED =
      "birthday_main_played";


    const SECRET_PLAYED =
      "birthday_secret_played";


    /*
     * 新しいページアクセスかどうか判定。
     *
     * "navigate"
     * → NFCなどから新しく開いた
     *
     * "reload"
     * → ページ再読み込み
     *
     * "back_forward"
     * → ブラウザの戻る/進む
     *
     * NFCからの新規アクセスだけ状態をリセットする。
     */

    const navigationEntry =
      performance.getEntriesByType(
        "navigation"
      )[0];


    const navigationType =
      navigationEntry
        ? navigationEntry.type
        : "navigate";


    if (
      navigationType ===
      "navigate"
    ) {

      /*
       * 今回の新しいNFCアクセスなので
       * 前回のセッション状態を破棄。
       */

      sessionStorage.removeItem(
        MAIN_PLAYED
      );


      sessionStorage.removeItem(
        SECRET_PLAYED
      );


      /*
       * 以前のバージョンで使用していた
       * localStorageも念のため消去。
       */

      localStorage.removeItem(
        MAIN_PLAYED
      );


      localStorage.removeItem(
        SECRET_PLAYED
      );

    }


    /* =========================================================
       要素取得
       ========================================================= */

    const stage1 =
      document.getElementById(
        "stage1"
      );


    const stage2 =
      document.getElementById(
        "stage2"
      );


    const stage3 =
      document.getElementById(
        "stage3"
      );


    const mainLink =
      document.getElementById(
        "mainLink"
      );


    const secretLink =
      document.getElementById(
        "secretLink"
      );


    const backLink2 =
      document.getElementById(
        "backLink2"
      );


    const backLink3 =
      document.getElementById(
        "backLink3"
      );


    const confettiContainer =
      document.getElementById(
        "confettiContainer"
      );


    const emojiContainer =
      document.getElementById(
        "emojiContainer"
      );


    /* =========================================================
       紙吹雪生成
       ========================================================= */

    function createConfetti() {

      confettiContainer.innerHTML = "";


      const count = 100;


      const colors = [

        "#ff3b81",
        "#ff9f43",
        "#ffe45c",
        "#55e89a",
        "#4bd8ff",
        "#8585ff",
        "#ef65e8",
        "#ffffff",
        "#ffd700"

      ];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const piece =
          document.createElement(
            "span"
          );


        piece.className =
          "confetti";


        const size =
          6 +
          Math.random() * 7;


        const height =
          10 +
          Math.random() * 12;


        const left =
          Math.random() * 100;


        const drift =
          (
            Math.random() * 60 -
            30
          ) + "vw";


        const rotation =
          (
            Math.random() * 1800 -
            900
          ) + "deg";


        const fallTime =
          (
            3 +
            Math.random() * 2
          ) + "s";


        const delay =
          (
            Math.random() * .7
          ) + "s";


        piece.style.left =
          left + "%";


        piece.style.width =
          size + "px";


        piece.style.height =
          height + "px";


        piece.style.background =
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];


        piece.style.setProperty(
          "--drift",
          drift
        );


        piece.style.setProperty(
          "--rotation",
          rotation
        );


        piece.style.animation =
          `confettiFall ${fallTime} linear ${delay} forwards`;


        confettiContainer.appendChild(
          piece
        );

      }

    }


    /* =========================================================
       絵文字生成
       ========================================================= */

    function createFallingEmojis() {

      emojiContainer.innerHTML =
        "";


      const count = 60;


      const emojis = [

        "🥳",
        "🎉",
        "🎊",
        "✨",
        "⭐",
        "💥"

      ];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const emoji =
          document.createElement(
            "span"
          );


        emoji.className =
          "falling-emoji";


        emoji.textContent =
          emojis[
            Math.floor(
              Math.random() *
              emojis.length
            )
          ];


        const left =
          Math.random() * 100;


        const size =
          18 +
          Math.random() * 25;


        const duration =
          3.2 +
          Math.random() * 2.5;


        const delay =
          Math.random() * .9;


        const drift =
          (
            Math.random() * 70 -
            35
          ) + "vw";


        const midDrift =
          (
            Math.random() * 45 -
            22.5
          ) + "vw";


        const rotation =
          (
            Math.random() * 900 -
            450
          ) + "deg";


        const midRotation =
          (
            Math.random() * 360 -
            180
          ) + "deg";


        emoji.style.left =
          left + "%";


        emoji.style.fontSize =
          size + "px";


        emoji.style.setProperty(
          "--duration",
          duration + "s"
        );


        emoji.style.setProperty(
          "--delay",
          delay + "s"
        );


        emoji.style.setProperty(
          "--drift",
          drift
        );


        emoji.style.setProperty(
          "--mid-drift",
          midDrift
        );


        emoji.style.setProperty(
          "--rotation",
          rotation
        );


        emoji.style.setProperty(
          "--mid-rotation",
          midRotation
        );


        emojiContainer.appendChild(
          emoji
        );

      }

    }


    /* =========================================================
       演出開始
       ========================================================= */

    function startCelebration() {

      createConfetti();

      createFallingEmojis();

    }


    /* =========================================================
       画面表示
       ========================================================= */

    function render() {

      const mainPlayed =
        sessionStorage.getItem(
          MAIN_PLAYED
        ) === "true";


      const secretPlayed =
        sessionStorage.getItem(
          SECRET_PLAYED
        ) === "true";


      stage1.classList.add(
        "hidden"
      );


      stage2.classList.add(
        "hidden"
      );


      stage3.classList.add(
        "hidden"
      );


      backLink2.classList.add(
        "hidden"
      );


      backLink3.classList.add(
        "hidden"
      );


      /* =====================================================
         3ページ目
         ===================================================== */

      if (secretPlayed) {

        stage3.classList.remove(
          "hidden"
        );


        backLink3.classList.remove(
          "hidden"
        );


        document.body.style.overflow =
          "hidden";


        startCelebration();


        return;
      }


      /* =====================================================
         2ページ目
         ===================================================== */

      if (mainPlayed) {

        stage2.classList.remove(
          "hidden"
        );


        backLink2.classList.remove(
          "hidden"
        );


        document.body.style.overflowY =
          "auto";


        return;
      }


      /* =====================================================
         1ページ目
         ===================================================== */

      stage1.classList.remove(
        "hidden"
      );


      document.body.style.overflow =
        "hidden";

    }


    /* =========================================================
       CDを押したとき
       ========================================================= */

    mainLink.addEventListener(
      "click",
      function(e) {

        e.preventDefault();


        sessionStorage.setItem(
          MAIN_PLAYED,
          "true"
        );


        window.location.href =
          PLAYLIST_URL;

      }
    );


    /* =========================================================
       なんもねぇ
       ========================================================= */

    secretLink.addEventListener(
      "click",
      function(e) {

        e.preventDefault();


        sessionStorage.setItem(
          SECRET_PLAYED,
          "true"
        );


        window.location.href =
          SECRET_URL;

      }
    );


    /* =========================================================
       最初に戻る
       ========================================================= */

    function goBack() {

      sessionStorage.removeItem(
        MAIN_PLAYED
      );


      sessionStorage.removeItem(
        SECRET_PLAYED
      );


      window.scrollTo(
        0,
        0
      );


      render();

    }


    /* =========================================================
       2ページ目 戻る
       ========================================================= */

    backLink2.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        goBack();

      }
    );


    /* =========================================================
       3ページ目 戻る
       ========================================================= */

    backLink3.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        goBack();

      }
    );


    /* =========================================================
       YouTubeから戻ってきたとき
       ========================================================= */

    window.addEventListener(
      "pageshow",
      function() {

        render();

      }
    );


    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState ===
          "visible"
        ) {

          render();

        }

      }
    );


    /* =========================================================
       初回表示
       ========================================================= */

    render();

  </script>

</body>
</html>
