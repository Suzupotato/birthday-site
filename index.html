<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Mochiy+Pop+One&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       基本設定
       ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #fff;
      color: #222;
    }

    body {
      overflow-x: hidden;
    }

    .screen {
      width: 100%;
      min-height: 100svh;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }


    /* =========================
       1ページ目
       ========================= */

    #stage1 {
      min-height: 100svh;
      overflow: hidden;
    }

    .cd-button {
      display: block;

      width: min(72vw, 340px);
      height: min(72vw, 340px);

      border-radius: 50%;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition: transform .15s ease;
    }

    .cd-button:active {
      transform: scale(.96);
    }

    .cd-button img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =========================
       筆記体
       ========================= */

    .script-text {
      margin-top: 24px;

      font-family: "Dancing Script", cursive;

      font-size: 24px;
      font-weight: 500;

      letter-spacing: .02em;

      color: #777;
    }


    /* =========================
       2ページ目
       ========================= */

    #stage2 {
      min-height: 145svh;
      position: relative;
    }

    .stage2-main {
      min-height: 105svh;
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }


    /* =========================
       戻る + なんもねぇ
       ========================= */

    .secret-area {
      width: 100%;
      height: 40svh;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      position: relative;
    }

    .back-link {
      color: #777;

      font-size: 14px;

      text-decoration: underline;
      text-underline-offset: 4px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      margin-bottom: 8px;
    }

    .secret-link {
      color: #777;

      font-size: 3px;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
    }


    /* =========================================================
       3ページ目
       超豪華ゲーミング・クラッカー・紙吹雪モード
       ========================================================= */

    #stage3 {
      min-height: 100svh;
      position: relative;
      text-align: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255,255,255,1) 0%,
          rgba(255,245,190,.95) 13%,
          rgba(255,170,225,.82) 30%,
          rgba(130,210,255,.72) 48%,
          rgba(190,130,255,.72) 65%,
          rgba(50,20,100,.95) 100%
        );

      animation:
        backgroundPulse 4s ease-in-out infinite,
        gamingHue 7s linear infinite;
    }


    /* =========================
       七色ゲーミングの光
       ========================= */

    #stage3 .rainbow-glow {
      position: absolute;

      inset: -30%;

      background:
        conic-gradient(
          from 0deg,
          rgba(255,0,0,.28),
          rgba(255,165,0,.28),
          rgba(255,255,0,.28),
          rgba(0,255,100,.28),
          rgba(0,200,255,.28),
          rgba(100,80,255,.28),
          rgba(255,0,200,.28),
          rgba(255,0,0,.28)
        );

      filter: blur(35px);

      animation:
        rainbowRotate 9s linear infinite;

      pointer-events: none;
    }


    /* =========================
       光の中心・放射線
       ========================= */

    #stage3::before {
      content: "";

      position: absolute;

      width: 120vmax;
      height: 120vmax;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        repeating-conic-gradient(
          from 0deg,

          rgba(255,255,255,0) 0deg,
          rgba(255,255,255,.10) 3deg,

          rgba(255,80,160,.25) 6deg,
          rgba(255,255,255,0) 9deg,

          rgba(80,220,255,.25) 13deg,
          rgba(255,255,255,0) 17deg,

          rgba(255,230,80,.28) 21deg,
          rgba(255,255,255,0) 26deg
        );

      animation:
        raysSpin 10s linear infinite;

      pointer-events: none;
    }


    /* =========================
       キラキラ粒子
       ========================= */

    #stage3::after {
      content:
        "✦   ✧   ✨   ✦   ✧   ✨   ✦   ✧   ✨   ✦   ✧   ✨   ✦";

      position: absolute;

      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 5%;

      font-size: clamp(15px, 4vw, 28px);
      line-height: 4.5;
      letter-spacing: 12px;

      color: rgba(255,255,255,.95);

      text-shadow:
        0 0 5px #fff,
        0 0 12px #fff,
        0 0 22px #ffd95a,
        0 0 35px #ff69d4,
        0 0 45px #63eaff;

      pointer-events: none;

      animation:
        sparkleFloat 3s ease-in-out infinite,
        sparkleTwinkle 1.5s ease-in-out infinite alternate;
    }


    /* =========================================================
       クラッカー
       ========================================================= */

    .cracker {
      position: absolute;

      top: 50%;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      pointer-events: none;

      z-index: 7;

      opacity: 0;
    }


    .cracker-left {
      left: 6%;

      animation:
        crackerLeft 1.7s cubic-bezier(.15,.8,.2,1) .25s forwards;
    }


    .cracker-right {
      right: 6%;

      animation:
        crackerRight 1.7s cubic-bezier(.85,.2,.8,1) .25s forwards;
    }


    /* クラッカーから飛び散る粒 */

    .cracker-left::before,
    .cracker-left::after,
    .cracker-right::before,
    .cracker-right::after {
      content: "✦ ✧ ✨ • ◆ ★";

      position: absolute;

      font-size: 18px;
      font-weight: bold;

      width: 160px;

      line-height: 2;

      color: #fff;

      text-shadow:
        0 0 5px #fff,
        0 0 12px #ffdd55,
        0 0 20px #ff66cc;

      pointer-events: none;
    }


    .cracker-left::before {
      right: -10px;
      top: -90px;

      transform: rotate(-12deg);

      animation: crackerBurst 1.4s ease-out .35s forwards;
    }


    .cracker-left::after {
      right: -5px;
      top: 10px;

      transform: rotate(12deg);

      animation: crackerBurst 1.4s ease-out .4s forwards;
    }


    .cracker-right::before {
      left: -10px;
      top: -90px;

      transform: rotate(12deg);

      animation: crackerBurst 1.4s ease-out .35s forwards;
    }


    .cracker-right::after {
      left: -5px;
      top: 10px;

      transform: rotate(-12deg);

      animation: crackerBurst 1.4s ease-out .4s forwards;
    }


    /* =========================================================
       紙吹雪
       ========================================================= */

    .confetti-container {
      position: absolute;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 8;
    }


    .confetti {
      position: absolute;

      top: -12vh;

      width: 8px;
      height: 14px;

      opacity: 0;

      border-radius: 1px;

      animation:
        confettiFall var(--fall-time) linear var(--delay) forwards;

      transform:
        translate3d(
          0,
          0,
          0
        )
        rotate(0deg);
    }


    @keyframes confettiFall {

      0% {
        opacity: 0;

        transform:
          translate3d(0, -10vh, 0)
          rotate(0deg);
      }

      8% {
        opacity: 1;
      }

      100% {
        opacity: 1;

        transform:
          translate3d(
            var(--drift),
            120vh,
            0
          )
          rotate(var(--rotation));
      }

    }


    /* =========================
       誕生日メッセージ
       ========================= */

    .birthday-message {
      position: relative;
      z-index: 10;

      font-family: "Mochiy Pop One", sans-serif;

      font-size: clamp(28px, 8vw, 42px);

      font-weight: 400;

      letter-spacing: .08em;

      color: #fff;

      padding: 22px 28px;

      border-radius: 28px;

      background:
        linear-gradient(
          120deg,
          #ff3b81,
          #ff9f43,
          #ffe45c,
          #55e89a,
          #4bd8ff,
          #8585ff,
          #ef65e8,
          #ff3b81
        );

      background-size: 500% 500%;

      border: 4px solid rgba(255,255,255,.98);

      box-shadow:
        0 0 0 3px rgba(255,220,70,.85),
        0 0 12px #fff,
        0 0 28px #ff72ce,
        0 0 45px #6ce8ff,
        0 0 70px #ffe15b,
        0 0 100px rgba(255,80,210,.75),
        0 12px 40px rgba(40,10,80,.35);

      text-shadow:
        0 2px 0 rgba(100,40,90,.3),
        0 0 7px #fff,
        0 0 16px #fff,
        0 0 30px #ffdb5c;

      animation:
        birthdayAppear 1.1s cubic-bezier(.2,1.4,.4,1) forwards,
        birthdayGradient 3s linear 1.1s infinite,
        birthdayGlow 1.5s ease-in-out 1.1s infinite alternate;
    }


    /* =========================
       文字周辺の星
       ========================= */

    .birthday-message::before,
    .birthday-message::after {
      position: absolute;

      z-index: -1;

      color: #fff;

      text-shadow:
        0 0 6px #fff,
        0 0 14px #ffd95a,
        0 0 25px #ff9dd8,
        0 0 40px #5eeaff;

      pointer-events: none;
    }


    .birthday-message::before {
      content: "✦";

      left: -34px;
      top: -30px;

      font-size: 38px;

      animation:
        starPop 1.1s ease-in-out infinite,
        rainbowText 2s linear infinite;
    }


    .birthday-message::after {
      content: "✧";

      right: -34px;
      bottom: -28px;

      font-size: 42px;

      animation:
        starPop 1.1s ease-in-out .5s infinite,
        rainbowText 2s linear .5s infinite;
    }


    /* =========================
       3ページ目 戻る
       ========================= */

    .stage3-back {
      position: relative;

      z-index: 20;

      margin-top: 90px;
    }


    /* =========================================================
       アニメーション
       ========================================================= */

    @keyframes birthdayAppear {

      0% {
        opacity: 0;

        transform:
          scale(.35)
          rotate(-7deg);
      }

      55% {
        opacity: 1;

        transform:
          scale(1.13)
          rotate(2deg);
      }

      75% {
        transform:
          scale(.96)
          rotate(-1deg);
      }

      100% {
        opacity: 1;

        transform:
          scale(1)
          rotate(0deg);
      }

    }


    @keyframes birthdayGlow {

      0% {
        box-shadow:
          0 0 0 3px rgba(255,220,70,.7),
          0 0 15px #fff,
          0 0 30px #ff72ce,
          0 0 50px #6ce8ff,
          0 0 75px #ffe15b,
          0 10px 40px rgba(40,10,80,.3);
      }

      100% {
        box-shadow:
          0 0 0 5px rgba(255,240,100,1),
          0 0 25px #fff,
          0 0 50px #ff72ce,
          0 0 75px #6ce8ff,
          0 0 110px #ffe15b,
          0 12px 50px rgba(40,10,80,.4);
      }

    }


    @keyframes birthdayGradient {

      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }

    }


    @keyframes backgroundPulse {

      0%,
      100% {
        filter: saturate(1);
      }

      50% {
        filter: saturate(1.45);
      }

    }


    @keyframes gamingHue {

      0% {
        filter: hue-rotate(0deg) saturate(1.1);
      }

      25% {
        filter: hue-rotate(70deg) saturate(1.3);
      }

      50% {
        filter: hue-rotate(150deg) saturate(1.2);
      }

      75% {
        filter: hue-rotate(250deg) saturate(1.35);
      }

      100% {
        filter: hue-rotate(360deg) saturate(1.1);
      }

    }


    @keyframes rainbowRotate {

      from {
        transform:
          rotate(0deg)
          scale(1);
      }

      to {
        transform:
          rotate(360deg)
          scale(1);
      }

    }


    @keyframes raysSpin {

      from {
        transform:
          translate(-50%, -50%)
          rotate(0deg)
          scale(1);
      }

      to {
        transform:
          translate(-50%, -50%)
          rotate(360deg)
          scale(1);
      }

    }


    @keyframes sparkleFloat {

      0%,
      100% {
        transform:
          translateY(0)
          scale(1);
      }

      50% {
        transform:
          translateY(-10px)
          scale(1.08);
      }

    }


    @keyframes sparkleTwinkle {

      0% {
        opacity: .35;
      }

      100% {
        opacity: 1;
      }

    }


    @keyframes starPop {

      0%,
      100% {
        transform:
          scale(.7)
          rotate(0deg);

        opacity: .55;
      }

      50% {
        transform:
          scale(1.45)
          rotate(25deg);

        opacity: 1;
      }

    }


    @keyframes rainbowText {

      0% {
        color: #fff;
      }

      25% {
        color: #ffed6a;
      }

      50% {
        color: #71f6ff;
      }

      75% {
        color: #ff7de5;
      }

      100% {
        color: #fff;
      }

    }


    /* =========================
       クラッカーバースト
       ========================= */

    @keyframes crackerLeft {

      0% {
        opacity: 0;

        transform:
          translateX(0)
          scale(.3);
      }

      12% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          translateX(20vw)
          scale(1.8);
      }

    }


    @keyframes crackerRight {

      0% {
        opacity: 0;

        transform:
          translateX(0)
          scale(.3);
      }

      12% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          translateX(-20vw)
          scale(1.8);
      }

    }


    @keyframes crackerBurst {

      0% {
        opacity: 0;

        transform:
          scale(.2)
          translateX(0);
      }

      25% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          scale(1.3)
          translateX(70px);
      }

    }


    /* =========================
       スクロールバー非表示
       ========================= */

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    html {
      scrollbar-width: none;
    }

  </style>
</head>


<body>


  <!-- =========================
       1ページ目
       ========================= -->

  <section id="stage1" class="screen">

    <a id="mainLink" class="cd-button" href="#">

      <img
        src="CD.PNG"
        alt="Play"
      >

    </a>

    <div class="script-text">
      Dear you…
    </div>

  </section>



  <!-- =========================
       2ページ目
       ========================= -->

  <section id="stage2" class="hidden">

    <div class="stage2-main">

      <div class="script-text">
        thank you for Watching!
      </div>

    </div>


    <div class="secret-area">

      <a
        id="backLink2"
        class="back-link hidden"
        href="#"
      >
        戻る
      </a>


      <a
        id="secretLink"
        class="secret-link"
        href="#"
      >
        なんもねぇ
      </a>

    </div>

  </section>



  <!-- =========================
       3ページ目
       ========================= -->

  <section id="stage3" class="screen hidden">

    <!-- 七色ゲーミング光 -->
    <div class="rainbow-glow"></div>

    <!-- 左右クラッカー -->
    <div class="cracker cracker-left"></div>
    <div class="cracker cracker-right"></div>

    <!-- 紙吹雪 -->
    <div
      id="confettiContainer"
      class="confetti-container"
    ></div>


    <div class="birthday-message">
      誕生日おめでとう！
    </div>


    <a
      id="backLink3"
      class="back-link stage3-back hidden"
      href="#"
    >
      戻る
    </a>

  </section>



  <script>


    /* =========================
       YouTube URL
       ========================= */

    const PLAYLIST_URL =
      "https://youtube.com/playlist?list=PLE8o6D-qzhzY&si=udX1vBSBjEIDuKgC";

    const SECRET_URL =
      "https://youtu.be/aRiVUVNUhIs?si=hcRCJKqANeBVuRmt";


    /* =========================
       状態保存用
       ========================= */

    const MAIN_PLAYED =
      "birthday_main_played";

    const SECRET_PLAYED =
      "birthday_secret_played";


    /* =========================
       要素取得
       ========================= */

    const stage1 =
      document.getElementById("stage1");

    const stage2 =
      document.getElementById("stage2");

    const stage3 =
      document.getElementById("stage3");


    const mainLink =
      document.getElementById("mainLink");

    const secretLink =
      document.getElementById("secretLink");


    const backLink2 =
      document.getElementById("backLink2");

    const backLink3 =
      document.getElementById("backLink3");


    const confettiContainer =
      document.getElementById("confettiContainer");


    /* =========================
       紙吹雪生成
       ========================= */

    function createConfetti() {

      confettiContainer.innerHTML = "";

      const count = 85;

      const colors = [
        "#ff3b81",
        "#ff9f43",
        "#ffe45c",
        "#55e89a",
        "#4bd8ff",
        "#8585ff",
        "#ef65e8",
        "#ffffff"
      ];


      for (let i = 0; i < count; i++) {

        const piece =
          document.createElement("span");

        piece.className = "confetti";


        const size =
          5 + Math.random() * 7;

        const height =
          8 + Math.random() * 12;


        const left =
          Math.random() * 100;


        const drift =
          (Math.random() * 50 - 25) + "vw";


        const rotation =
          (Math.random() * 1440 - 720) + "deg";


        const fallTime =
          (3.0 + Math.random() * 2.5) + "s";


        const delay =
          (Math.random() * .8) + "s";


        piece.style.left =
          left + "%";

        piece.style.width =
          size + "px";

        piece.style.height =
          height + "px";

        piece.style.background =
          colors[
            Math.floor(
              Math.random() * colors.length
            )
          ];

        piece.style.setProperty(
          "--drift",
          drift
        );

        piece.style.setProperty(
          "--rotation",
          rotation
        );

        piece.style.setProperty(
          "--fall-time",
          fallTime
        );

        piece.style.setProperty(
          "--delay",
          delay
        );


        confettiContainer.appendChild(
          piece
        );

      }

    }


    /* =========================
       画面表示
       ========================= */

    function render() {

      const mainPlayed =
        localStorage.getItem(MAIN_PLAYED) === "true";

      const secretPlayed =
        localStorage.getItem(SECRET_PLAYED) === "true";


      stage1.classList.add("hidden");
      stage2.classList.add("hidden");
      stage3.classList.add("hidden");

      backLink2.classList.add("hidden");
      backLink3.classList.add("hidden");


      /* =========================
         3ページ目
         ========================= */

      if (secretPlayed) {

        stage3.classList.remove("hidden");

        backLink3.classList.remove("hidden");

        document.body.style.overflow = "hidden";

        createConfetti();

        return;
      }


      /* =========================
         2ページ目
         ========================= */

      if (mainPlayed) {

        stage2.classList.remove("hidden");

        backLink2.classList.remove("hidden");

        document.body.style.overflowY = "auto";

        return;
      }


      /* =========================
         1ページ目
         ========================= */

      stage1.classList.remove("hidden");

      document.body.style.overflow = "hidden";

    }


    /* =========================
       CDを押したとき
       ========================= */

    mainLink.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        localStorage.setItem(
          MAIN_PLAYED,
          "true"
        );

        window.location.href =
          PLAYLIST_URL;

      }
    );


    /* =========================
       なんもねぇ
       ========================= */

    secretLink.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        localStorage.setItem(
          SECRET_PLAYED,
          "true"
        );

        window.location.href =
          SECRET_URL;

      }
    );


    /* =========================
       最初に戻る
       ========================= */

    function goBack() {

      localStorage.removeItem(
        MAIN_PLAYED
      );

      localStorage.removeItem(
        SECRET_PLAYED
      );

      window.scrollTo(0, 0);

      render();

    }


    /* 2ページ目 */

    backLink2.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        goBack();

      }
    );


    /* 3ページ目 */

    backLink3.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        goBack();

      }
    );


    /* =========================
       YouTubeから戻ってきたとき
       ========================= */

    window.addEventListener(
      "pageshow",
      function() {

        render();

      }
    );


    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState === "visible"
        ) {

          render();

        }

      }
    );


    /* =========================
       初回表示
       ========================= */

    render();

  </script>

</body>
</html>
