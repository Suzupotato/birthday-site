<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #ffffff;
      color: #222;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       共通
       ========================= */

    .screen {
      width: 100%;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       Stage 1
       ========================= */

    #stage1 {
      min-height: 100svh;
      overflow: hidden;
    }

    .cd-button {
      display: block;
      width: min(72vw, 340px);
      height: min(72vw, 340px);
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .cd-button:active {
      transform: scale(0.96);
    }

    .cd-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .small-text {
      margin-top: 24px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #999;
    }

    /* =========================
       Stage 2
       ========================= */

    #stage2 {
      min-height: 145svh;
      position: relative;
    }

    .stage2-main {
      min-height: 105svh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /*
       「なんもねぇ」はかなり小さく。
       今までの「なんもねぇ」より小さくして、
       見つけた時にちょっと嬉しいくらいのサイズ。
    */
    .secret-area {
      width: 100%;
      height: 40svh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 8svh;
    }

    .secret-link {
      color: #777;
      font-size: 5px;
      text-decoration: underline;
      text-underline-offset: 3px;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       Stage 3
       ========================= */

    #stage3 {
      min-height: 100svh;
      position: relative;
      text-align: center;
    }

    .birthday-message {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 600;
      letter-spacing: 0.08em;
      animation: appear 1.2s ease forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       戻る
       Stage 2 / Stage 3 共通
       ========================= */

    .back-link {
  position: absolute;
  right: 20px;
  bottom: 20px;

  color: #777;
  font-size: 14px;
  text-decoration: underline;
  text-underline-offset: 4px;

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

    /* =========================
       スクロールバー
       ========================= */

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    html {
      scrollbar-width: none;
    }
  </style>
</head>


<body>

  <!-- =========================
       Stage 1
       最初のCD画面
       ========================= -->

  <section id="stage1" class="screen">

    <a id="mainLink" class="cd-button" href="#">
      <img src="CD.PNG" alt="Play">
    </a>

    <div class="small-text">
      FOR YOU
    </div>

  </section>


  <!-- =========================
       Stage 2
       プレイリストから戻った後
       ========================= -->

  <section id="stage2" class="hidden">

    <div class="stage2-main">
      <div class="small-text">
        FOR YOU
      </div>
    </div>

    <div class="secret-area">

      <a id="secretLink" class="secret-link" href="#">
        なんもねぇ
      </a>

    </div>

  </section>


  <!-- =========================
       Stage 3
       なんもねぇから戻った後
       ========================= -->

  <section id="stage3" class="screen hidden">

    <div class="birthday-message">
      誕生日おめでとう！
    </div>

  </section>


  <!-- =========================
       共通の「戻る」
       ========================= -->

  <a id="backLink" class="back-link hidden" href="#">
    戻る
  </a>


  <script>

    /* ==========================================
       YouTube URL
       ========================================== */

    const PLAYLIST_URL =
      "https://youtube.com/playlist?list=PLE8o6D-qzhzY&si=udX1vBSBjEIDuKgC";

    const SECRET_URL =
      "https://youtu.be/aRiVUVNUhIs?si=hcRCJKqANeBVuRmt";


    /* ==========================================
       ステージ管理用
       ========================================== */

    const MAIN_PLAYED = "birthday_main_played";
    const SECRET_PLAYED = "birthday_secret_played";


    const stage1 = document.getElementById("stage1");
    const stage2 = document.getElementById("stage2");
    const stage3 = document.getElementById("stage3");

    const mainLink = document.getElementById("mainLink");
    const secretLink = document.getElementById("secretLink");
    const backLink = document.getElementById("backLink");


    /* ==========================================
       表示切り替え
       ========================================== */

    function render() {

      const mainPlayed =
        localStorage.getItem(MAIN_PLAYED) === "true";

      const secretPlayed =
        localStorage.getItem(SECRET_PLAYED) === "true";


      /* いったん全部隠す */

      stage1.classList.add("hidden");
      stage2.classList.add("hidden");
      stage3.classList.add("hidden");
      backLink.classList.add("hidden");


      /* =========================
         Stage 3
         ========================= */

      if (secretPlayed) {

        stage3.classList.remove("hidden");
        backLink.classList.remove("hidden");

        document.body.style.overflow = "hidden";

        return;
      }


      /* =========================
         Stage 2
         ========================= */

      if (mainPlayed) {

        stage2.classList.remove("hidden");
        backLink.classList.remove("hidden");

        document.body.style.overflowY = "auto";

        return;
      }


      /* =========================
         Stage 1
         ========================= */

      stage1.classList.remove("hidden");

      document.body.style.overflow = "hidden";
    }


    /* ==========================================
       CD → YouTubeプレイリスト
       ========================================== */

    mainLink.addEventListener("click", function(event) {

      event.preventDefault();

      /*
         YouTubeへ行く前にステージ1クリアを記録
      */

      localStorage.setItem(MAIN_PLAYED, "true");

      window.location.href = PLAYLIST_URL;

    });


    /* ==========================================
       なんもねぇ → YouTube
       ========================================== */

    secretLink.addEventListener("click", function(event) {

      event.preventDefault();

      /*
         YouTubeへ行く前にステージ2クリアを記録
      */

      localStorage.setItem(SECRET_PLAYED, "true");

      window.location.href = SECRET_URL;

    });


    /* ==========================================
       戻る
       ========================================== */

    backLink.addEventListener("click", function(event) {

      event.preventDefault();

      /*
         進行状況を全部リセット
      */

      localStorage.removeItem(MAIN_PLAYED);
      localStorage.removeItem(SECRET_PLAYED);

      /*
         ページを一番上へ
      */

      window.scrollTo(0, 0);

      /*
         最初のCD画面へ
      */

      render();

    });


    /* ==========================================
       YouTubeなど外部ページから戻ってきた時
       ========================================== */

    window.addEventListener("pageshow", function() {
      render();
    });


    /*
       Safari / iPhoneでページが再表示された時も確認
    */

    document.addEventListener("visibilitychange", function() {

      if (document.visibilityState === "visible") {
        render();
      }

    });


    /* ==========================================
       初回表示
       ========================================== */

    render();

  </script>

</body>
</html>
