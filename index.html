<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Mochiy+Pop+One&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       基本設定
       ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #fff;
      color: #222;
    }

    body {
      overflow-x: hidden;
    }

    .screen {
      width: 100%;
      min-height: 100svh;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }


    /* =========================
       1ページ目
       ========================= */

    #stage1 {
      min-height: 100svh;
      overflow: hidden;
    }

    .cd-button {
      display: block;

      width: min(72vw, 340px);
      height: min(72vw, 340px);

      border-radius: 50%;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition: transform .15s ease;
    }

    .cd-button:active {
      transform: scale(.96);
    }

    .cd-button img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =========================
       筆記体
       ========================= */

    .script-text {
      margin-top: 24px;

      font-family: "Dancing Script", cursive;

      font-size: 24px;
      font-weight: 500;

      letter-spacing: .02em;

      color: #777;
    }


    /* =========================
       2ページ目
       ========================= */

    #stage2 {
      min-height: 145svh;
      position: relative;
    }

    .stage2-main {
      min-height: 105svh;
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }


    /* =========================
       戻る + なんもねぇ
       ========================= */

    .secret-area {
      width: 100%;
      height: 40svh;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      position: relative;
    }

    .back-link {
      color: #777;

      font-size: 14px;

      text-decoration: underline;
      text-underline-offset: 4px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      margin-bottom: 8px;
    }

    .secret-link {
      color: #777;

      font-size: 3px;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       3ページ目
       豪華バースデー演出
       ========================= */

    #stage3 {
      min-height: 100svh;
      position: relative;
      text-align: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255,255,255,.98) 0%,
          rgba(255,245,190,.82) 18%,
          rgba(255,205,225,.65) 38%,
          rgba(190,215,255,.55) 58%,
          rgba(170,120,220,.48) 78%,
          rgba(60,35,100,.88) 100%
        );

      animation: backgroundPulse 5s ease-in-out infinite;
    }


    /* 光の中心 */

    #stage3::before {
      content: "";

      position: absolute;

      width: 85vmax;
      height: 85vmax;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(255,255,255,.00) 0deg,
          rgba(255,255,255,.16) 4deg,
          rgba(255,230,100,.32) 7deg,
          rgba(255,255,255,.00) 11deg,
          rgba(255,255,255,.00) 18deg
        );

      animation: raysSpin 18s linear infinite;

      pointer-events: none;
    }


    /* キラキラ粒子レイヤー */

    #stage3::after {
      content:
        "✦   ✧      ✨    ✦       ✧   ✨      ✦   ✧      ✨   ✦      ✧";
      
      position: absolute;

      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 12%;

      font-size: clamp(12px, 3vw, 22px);
      line-height: 5;
      letter-spacing: 9px;

      color: rgba(255,255,255,.92);

      text-shadow:
        0 0 5px rgba(255,255,255,.9),
        0 0 12px rgba(255,220,80,.8),
        0 0 22px rgba(255,150,220,.65);

      pointer-events: none;

      animation:
        sparkleFloat 4s ease-in-out infinite,
        sparkleTwinkle 2.4s ease-in-out infinite alternate;
    }


    /* =========================
       バースデー文字
       ========================= */

    .birthday-message {
      position: relative;
      z-index: 10;

      font-family: "Mochiy Pop One", sans-serif;

      font-size: clamp(28px, 8vw, 42px);

      font-weight: 400;

      letter-spacing: .08em;

      color: #fff;

      padding: 22px 28px;

      border-radius: 28px;

      background:
        linear-gradient(
          135deg,
          rgba(255,110,180,.92),
          rgba(255,175,80,.92),
          rgba(255,220,90,.92),
          rgba(255,125,180,.92)
        );

      background-size: 300% 300%;

      border: 3px solid rgba(255,255,255,.95);

      box-shadow:
        0 0 0 3px rgba(255,210,80,.75),
        0 0 16px rgba(255,255,255,.95),
        0 0 30px rgba(255,170,220,.9),
        0 0 55px rgba(255,210,80,.75),
        0 10px 35px rgba(100,50,120,.28);

      text-shadow:
        0 2px 0 rgba(150,60,100,.25),
        0 0 7px rgba(255,255,255,.95),
        0 0 16px rgba(255,255,255,.9);

      animation:
        birthdayAppear 1.1s cubic-bezier(.2,1.4,.4,1) forwards,
        birthdayGradient 4s ease-in-out 1.1s infinite,
        birthdayGlow 2.5s ease-in-out 1.1s infinite alternate;
    }


    /* =========================
       文字の周囲の星
       ========================= */

    .birthday-message::before,
    .birthday-message::after {
      position: absolute;

      z-index: -1;

      color: #fff;

      text-shadow:
        0 0 6px #fff,
        0 0 14px #ffd95a,
        0 0 25px #ff9dd8;

      pointer-events: none;
    }

    .birthday-message::before {
      content: "✦";

      left: -28px;
      top: -24px;

      font-size: 30px;

      animation: starPop 1.8s ease-in-out infinite;
    }

    .birthday-message::after {
      content: "✧";

      right: -28px;
      bottom: -22px;

      font-size: 34px;

      animation: starPop 1.8s ease-in-out .8s infinite;
    }


    /* =========================
       3ページ目の戻る
       ========================= */

    .stage3-back {
      position: relative;
      z-index: 20;

      margin-top: 90px;
    }


    /* =========================
       アニメーション
       ========================= */

    @keyframes birthdayAppear {

      0% {
        opacity: 0;
        transform: scale(.45) rotate(-4deg);
      }

      65% {
        opacity: 1;
        transform: scale(1.08) rotate(1deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }

    }


    @keyframes birthdayGlow {

      0% {
        box-shadow:
          0 0 0 3px rgba(255,210,80,.65),
          0 0 14px rgba(255,255,255,.8),
          0 0 25px rgba(255,170,220,.65),
          0 0 45px rgba(255,210,80,.55),
          0 10px 35px rgba(100,50,120,.25);
      }

      100% {
        box-shadow:
          0 0 0 4px rgba(255,235,120,.9),
          0 0 22px rgba(255,255,255,1),
          0 0 42px rgba(255,170,220,1),
          0 0 75px rgba(255,220,80,.85),
          0 10px 40px rgba(100,50,120,.3);
      }

    }


    @keyframes birthdayGradient {

      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }

    }


    @keyframes backgroundPulse {

      0%,
      100% {
        filter: saturate(1);
      }

      50% {
        filter: saturate(1.18);
      }

    }


    @keyframes raysSpin {

      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }

    }


    @keyframes sparkleFloat {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-8px) scale(1.04);
      }

    }


    @keyframes sparkleTwinkle {

      0% {
        opacity: .45;
      }

      100% {
        opacity: 1;
      }

    }


    @keyframes starPop {

      0%,
      100% {
        transform: scale(.75) rotate(0deg);
        opacity: .55;
      }

      50% {
        transform: scale(1.35) rotate(20deg);
        opacity: 1;
      }

    }


    /* =========================
       スクロールバー非表示
       ========================= */

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    html {
      scrollbar-width: none;
    }

  </style>
</head>


<body>


  <!-- =========================
       1ページ目
       ========================= -->

  <section id="stage1" class="screen">

    <a id="mainLink" class="cd-button" href="#">

      <img
        src="CD.PNG"
        alt="Play"
      >

    </a>

    <div class="script-text">
      Dear you…
    </div>

  </section>



  <!-- =========================
       2ページ目
       ========================= -->

  <section id="stage2" class="hidden">

    <div class="stage2-main">

      <div class="script-text">
        thank you for  Watching!
      </div>

    </div>


    <div class="secret-area">

      <a
        id="backLink2"
        class="back-link hidden"
        href="#"
      >
        戻る
      </a>


      <a
        id="secretLink"
        class="secret-link"
        href="#"
      >
        なんもねぇ
      </a>

    </div>

  </section>



  <!-- =========================
       3ページ目
       ========================= -->

  <section id="stage3" class="screen hidden">

    <div class="birthday-message">
      誕生日おめでとう！
    </div>


    <a
      id="backLink3"
      class="back-link stage3-back hidden"
      href="#"
    >
      戻る
    </a>

  </section>



  <script>


    /* =========================
       YouTube URL
       ========================= */

    const PLAYLIST_URL =
      "https://youtube.com/playlist?list=PLE8o6D-qzhzY&si=udX1vBSBjEIDuKgC";

    const SECRET_URL =
      "https://youtu.be/aRiVUVNUhIs?si=hcRCJKqANeBVuRmt";


    /* =========================
       状態保存用
       ========================= */

    const MAIN_PLAYED =
      "birthday_main_played";

    const SECRET_PLAYED =
      "birthday_secret_played";


    /* =========================
       要素取得
       ========================= */

    const stage1 =
      document.getElementById("stage1");

    const stage2 =
      document.getElementById("stage2");

    const stage3 =
      document.getElementById("stage3");


    const mainLink =
      document.getElementById("mainLink");

    const secretLink =
      document.getElementById("secretLink");


    const backLink2 =
      document.getElementById("backLink2");

    const backLink3 =
      document.getElementById("backLink3");


    /* =========================
       画面表示
       ========================= */

    function render() {

      const mainPlayed =
        localStorage.getItem(MAIN_PLAYED) === "true";

      const secretPlayed =
        localStorage.getItem(SECRET_PLAYED) === "true";


      stage1.classList.add("hidden");
      stage2.classList.add("hidden");
      stage3.classList.add("hidden");

      backLink2.classList.add("hidden");
      backLink3.classList.add("hidden");


      /* =========================
         3ページ目
         ========================= */

      if (secretPlayed) {

        stage3.classList.remove("hidden");

        backLink3.classList.remove("hidden");

        document.body.style.overflow = "hidden";

        return;
      }


      /* =========================
         2ページ目
         ========================= */

      if (mainPlayed) {

        stage2.classList.remove("hidden");

        backLink2.classList.remove("hidden");

        document.body.style.overflowY = "auto";

        return;
      }


      /* =========================
         1ページ目
         ========================= */

      stage1.classList.remove("hidden");

      document.body.style.overflow = "hidden";

    }


    /* =========================
       CDを押したとき
       ========================= */

    mainLink.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        localStorage.setItem(
          MAIN_PLAYED,
          "true"
        );

        window.location.href =
          PLAYLIST_URL;

      }
    );


    /* =========================
       なんもねぇ
       ========================= */

    secretLink.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        localStorage.setItem(
          SECRET_PLAYED,
          "true"
        );

        window.location.href =
          SECRET_URL;

      }
    );


    /* =========================
       最初に戻る
       ========================= */

    function goBack() {

      localStorage.removeItem(
        MAIN_PLAYED
      );

      localStorage.removeItem(
        SECRET_PLAYED
      );

      window.scrollTo(0, 0);

      render();

    }


    /* 2ページ目 */

    backLink2.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        goBack();

      }
    );


    /* 3ページ目 */

    backLink3.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        goBack();

      }
    );


    /* =========================
       YouTubeから戻ってきたとき
       ========================= */

    window.addEventListener(
      "pageshow",
      function() {

        render();

      }
    );


    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState === "visible"
        ) {

          render();

        }

      }
    );


    /* =========================
       初回表示
       ========================= */

    render();

  </script>

</body>
</html>
