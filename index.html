<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You</title>

  <!-- ポップなフォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #fff;
      color: #222;
    }

    body {
      overflow-x: hidden;
    }

    .screen {
      width: 100%;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }


    /* =========================
       1ページ目
       ========================= */

    #stage1 {
      min-height: 100svh;
      overflow: hidden;
    }

    .cd-button {
      display: block;
      width: min(72vw, 340px);
      height: min(72vw, 340px);
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease;
    }

    .cd-button:active {
      transform: scale(.96);
    }

    .cd-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .small-text {
      margin-top: 24px;
      font-size: 12px;
      letter-spacing: .15em;
      color: #999;
    }


    /* =========================
       2ページ目
       ========================= */

    #stage2 {
      min-height: 145svh;
      position: relative;
    }

    .stage2-main {
      min-height: 105svh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .secret-area {
      width: 100%;
      height: 40svh;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      position: relative;
    }

    /* 戻る */
    .back-link {
      color: #777;
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 8px;
    }

    /* なんもねぇ */
    .secret-link {
      color: #777;
      font-size: 3px;
      text-decoration: underline;
      text-underline-offset: 3px;
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       3ページ目
       ========================= */

    #stage3 {
      min-height: 100svh;
      position: relative;
      text-align: center;
    }

    .birthday-message {
      font-family: "Mochiy Pop One", sans-serif;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 400;
      letter-spacing: .08em;
      animation: appear 1.2s ease forwards;
    }

    /* 3ページ目の戻る */
    .stage3-back {
      margin-top: 40px;
    }


    /* =========================
       アニメーション
       ========================= */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================
       スクロールバー非表示
       ========================= */

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    html {
      scrollbar-width: none;
    }
  </style>
</head>


<body>

  <!-- =========================
       1ページ目
       ========================= -->

  <section id="stage1" class="screen">

    <a id="mainLink" class="cd-button" href="#">
      <img src="CD.PNG" alt="Play">
    </a>

    <div class="small-text">
      FOR YOU
    </div>

  </section>


  <!-- =========================
       2ページ目
       ========================= -->

  <section id="stage2" class="hidden">

    <div class="stage2-main">

      <div class="small-text">
        FOR YOU
      </div>

    </div>


    <div class="secret-area">

      <a id="backLink2" class="back-link hidden" href="#">
        戻る
      </a>

      <a id="secretLink" class="secret-link" href="#">
        なんもねぇ
      </a>

    </div>

  </section>


  <!-- =========================
       3ページ目
       ========================= -->

  <section id="stage3" class="screen hidden">

    <div class="birthday-message">
      誕生日おめでとう！
    </div>

    <a id="backLink3" class="back-link stage3-back hidden" href="#">
      戻る
    </a>

  </section>


  <script>

    /* =========================
       YouTube URL
       ========================= */

    const PLAYLIST_URL =
      "https://youtube.com/playlist?list=PLE8o6D-qzhzY&si=udX1vBSBjEIDuKgC";

    const SECRET_URL =
      "https://youtu.be/aRiVUVNUhIs?si=hcRCJKqANeBVuRmt";


    /* =========================
       状態保存用
       ========================= */

    const MAIN_PLAYED = "birthday_main_played";
    const SECRET_PLAYED = "birthday_secret_played";


    /* =========================
       要素取得
       ========================= */

    const stage1 = document.getElementById("stage1");
    const stage2 = document.getElementById("stage2");
    const stage3 = document.getElementById("stage3");

    const mainLink = document.getElementById("mainLink");
    const secretLink = document.getElementById("secretLink");

    const backLink2 = document.getElementById("backLink2");
    const backLink3 = document.getElementById("backLink3");


    /* =========================
       画面表示
       ========================= */

    function render() {

      const mainPlayed =
        localStorage.getItem(MAIN_PLAYED) === "true";

      const secretPlayed =
        localStorage.getItem(SECRET_PLAYED) === "true";


      /* 全部隠す */

      stage1.classList.add("hidden");
      stage2.classList.add("hidden");
      stage3.classList.add("hidden");

      backLink2.classList.add("hidden");
      backLink3.classList.add("hidden");


      /* =========================
         3ページ目
         ========================= */

      if (secretPlayed) {

        stage3.classList.remove("hidden");
        backLink3.classList.remove("hidden");

        document.body.style.overflow = "hidden";

        return;
      }


      /* =========================
         2ページ目
         ========================= */

      if (mainPlayed) {

        stage2.classList.remove("hidden");
        backLink2.classList.remove("hidden");

        document.body.style.overflowY = "auto";

        return;
      }


      /* =========================
         1ページ目
         ========================= */

      stage1.classList.remove("hidden");

      document.body.style.overflow = "hidden";
    }


    /* =========================
       CDを押したとき
       ========================= */

    mainLink.addEventListener("click", function(e) {

      e.preventDefault();

      localStorage.setItem(MAIN_PLAYED, "true");

      window.location.href = PLAYLIST_URL;

    });


    /* =========================
       なんもねぇ
       ========================= */

    secretLink.addEventListener("click", function(e) {

      e.preventDefault();

      localStorage.setItem(SECRET_PLAYED, "true");

      window.location.href = SECRET_URL;

    });


    /* =========================
       戻る
       ========================= */

    function goBack() {

      localStorage.removeItem(MAIN_PLAYED);
      localStorage.removeItem(SECRET_PLAYED);

      window.scrollTo(0, 0);

      render();
    }


    backLink2.addEventListener("click", function(e) {

      e.preventDefault();

      goBack();

    });


    backLink3.addEventListener("click", function(e) {

      e.preventDefault();

      goBack();

    });


    /* =========================
       YouTubeから戻ってきたとき
       ========================= */

    window.addEventListener("pageshow", function() {

      render();

    });


    document.addEventListener("visibilitychange", function() {

      if (document.visibilityState === "visible") {

        render();

      }

    });


    /* 初回表示 */

    render();

  </script>

</body>
</html>
